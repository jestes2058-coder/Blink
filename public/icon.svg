<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Center Droplet Icon -->
  <path d="M256 96 C256 96 144 236 144 324 C144 386 194 436 256 436 C318 436 368 386 368 324 C368 236 256 96 256 96 Z" fill="url(#dropGrad)" filter="url(#shadow)" />

  <!-- Heart Inside Droplet -->
  <path d="M256 348 C256 348 206 312 196 288 C186 264 204 246 226 246 C242 246 252 258 256 264 C260 258 270 246 286 246 C308 246 326 264 316 288 C306 312 256 348 256 348 Z" fill="#DC2626" />

  <!-- Cross Accent -->
  <circle cx="340" cy="170" r="28" fill="#FACC15" filter="url(#shadow)" />
  <rect x="334" y="152" width="12" height="36" rx="6" fill="#78350F" />
  <rect x="322" y="164" width="36" height="12" rx="6" fill="#78350F" />
</svg>
